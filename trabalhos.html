<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trabalhos — Hidro Drone</title>
<meta name="description" content="Galeria completa de vídeos de serviços executados pela Hidro Drone: limpeza de fachadas e estruturas industriais com drone de alta pressão.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-ink:#0D1A40;--blue:#1D4ED8;--ink:#0F1B33;--ink-2:#46566F;--line:#DDE5F0;
    --paper:#FFFFFF;--paper-2:#F5F8FC;--radius:14px;--shadow:0 10px 30px rgba(15,27,51,.10);--wrap:1160px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--paper-2);line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px}
  header{background:var(--navy-ink);color:#fff;padding:14px 0}
  header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}
  header b{font-family:'Barlow Condensed',sans-serif;font-size:1.3rem;letter-spacing:.04em;text-transform:uppercase}
  header a{color:#B9CBF0;text-decoration:none;font-weight:600;font-size:.9rem}
  header a:hover{color:#fff}
  main{padding:56px 0 76px}
  .eyebrow{display:inline-block;font-weight:800;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin-bottom:12px}
  h1{font-size:clamp(1.8rem,3.6vw,2.6rem);font-weight:800;line-height:1.15;margin-bottom:14px}
  .sub{color:var(--ink-2);max-width:62ch;font-size:1.05rem;margin-bottom:42px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  @media (max-width:960px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:620px){.grid{grid-template-columns:1fr}}
  figure{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  figure video{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#07141a}
  figcaption{padding:14px 16px}
  figcaption b{display:block;font-weight:800}
  figcaption b a{color:var(--ink);text-decoration:none}
  figcaption b a:hover{color:var(--blue);text-decoration:underline}
  figcaption span{font-size:.9rem;color:var(--ink-2)}
  .tmp{display:inline-block;background:#FFF6DB;color:#8A6A12;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:3px 10px;margin-top:8px}
</style>
</head>
<body>

<header><div class="wrap">
  <b>Hidro Drone</b>
  <a href="alt-11.html#trabalhos">← Voltar para o site</a>
</div></header>

<main><div class="wrap">
  <span class="eyebrow">Trabalhos</span>
  <h1>Todos os vídeos, direto da operação</h1>
  <p class="sub">Nada de banco de imagens: cada vídeo é de um serviço executado pela nossa equipe. Toque para assistir.</p>

  <!-- TODO: trocar pelos vídeos oficiais de cada cliente quando o marketing enviar -->
  <div class="grid">
    <figure>
      <video controls preload="none" muted loop playsinline poster="assets/instagram/DMGvmAMvFcD_video.jpg" src="assets/instagram/videos/DMGvmAMvFcD.mp4"></video>
      <figcaption><b><a href="https://www.valmet.com/pt/" target="_blank" rel="noopener">Valmet ↗</a></b><span>Fachada metálica — galpão industrial</span><br><span class="tmp">vídeo provisório</span></figcaption>
    </figure>
    <figure>
      <video controls preload="none" muted loop playsinline poster="assets/instagram/DUY-6OFj39r_video.jpg" src="assets/instagram/videos/DUY-6OFj39r.mp4"></video>
      <figcaption><b><a href="https://grasp.ind.br/" target="_blank" rel="noopener">GRASP ↗</a></b><span>Prédio comercial — fachada e letreiro</span></figcaption>
    </figure>
    <figure>
      <video controls preload="none" muted loop playsinline poster="assets/instagram/DYSY9k-yZJg_video.jpg" src="assets/instagram/videos/DYSY9k-yZJg.mp4"></video>
      <figcaption><b><a href="https://grasp.ind.br/" target="_blank" rel="noopener">GRASP Sertãozinho ↗</a></b><span>Estrutura industrial — limpeza em altura</span><br><span class="tmp">vídeo provisório</span></figcaption>
    </figure>
    <figure>
      <video controls preload="none" muted loop playsinline poster="assets/instagram/Da1C3tSPVmT_video.jpg" src="assets/instagram/videos/Da1C3tSPVmT.mp4"></video>
      <figcaption><b><a href="https://www.vw.com.br/" target="_blank" rel="noopener">Volkswagen ↗</a></b><span>Planta industrial</span><br><span class="tmp">vídeo provisório</span></figcaption>
    </figure>
    <figure>
      <video controls preload="none" muted loop playsinline poster="assets/instagram/DbZDqLLviPU_video.jpg" src="assets/instagram/videos/DbZDqLLviPU.mp4"></video>
      <!-- TODO: link do site da igreja quando definirem qual é (Bom Jesus do Cabral ou Imaculada Conceição) -->
      <figcaption><b>Igreja</b><span>Telhado e fachada histórica</span></figcaption>
    </figure>
    <figure>
      <video controls preload="none" muted loop playsinline poster="assets/instagram/DbeXVsYvZUr_video.jpg" src="assets/instagram/videos/DbeXVsYvZUr.mp4"></video>
      <figcaption><b><a href="https://paranaclube.com.br/" target="_blank" rel="noopener">Paraná Clube ↗</a></b><span>Lonas — cobertura tensionada</span></figcaption>
    </figure>
  </div>
</div></main>

</body>
</html>
